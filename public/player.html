<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>Chosen Reels player</title>
<!--
  Chosen Reels on iPhone. YouTube only plays embedded videos when the page
  sends a Referer, and the iOS app (capacitor://localhost) cannot send one.
  The app shows this https page instead, and this page shows the YouTube
  player, so YouTube gets a proper Referer (this website).

  It only passes messages along: player commands from the app (play, pause,
  mute...) go to YouTube, and YouTube's play/pause reports go back to the app.
  Usage: /player.html?v=VIDEO_ID&autoplay=1&mute=0
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var id = (q.get('v') || '').replace(/[^\w-]/g, '').slice(0, 20);
  if (!id) return;
  var params = new URLSearchParams({
    autoplay: q.get('autoplay') === '1' ? '1' : '0',
    mute: q.get('mute') === '1' ? '1' : '0',
    playsinline: '1', rel: '0', modestbranding: '1', controls: '0',
    loop: '1', playlist: id, // loop needs the playlist set to the same video
    enablejsapi: '1', origin: location.origin
  });
  var YT_ORIGIN = 'https://www.youtube.com';
  var player = document.createElement('iframe');
  player.src = YT_ORIGIN + '/embed/' + id + '?' + params;
  player.title = 'Video';
  player.allow = 'autoplay; encrypted-media; picture-in-picture';
  player.referrerPolicy = 'strict-origin-when-cross-origin';
  // Ask YouTube to report play/pause as soon as the player is there
  player.addEventListener('load', function () {
    player.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 'cw', channel: 'widget' }), YT_ORIGIN);
  });
  document.body.appendChild(player);

  var fromYouTube = /^https:\/\/(www\.)?youtube\.com$/;
  window.addEventListener('message', function (e) {
    // YouTube -> app
    if (e.source === player.contentWindow && fromYouTube.test(e.origin)) {
      if (window.parent !== window) window.parent.postMessage(e.data, '*');
      return;
    }
    // App -> YouTube: only the player's own command messages
    if (e.source === window.parent && window.parent !== window) {
      var data = e.data;
      if (typeof data !== 'string' || data.length > 500) return;
      var msg;
      try { msg = JSON.parse(data); } catch (err) { return; }
      if (msg && (msg.event === 'command' || msg.event === 'listening')) {
        player.contentWindow.postMessage(data, YT_ORIGIN);
      }
    }
  });
})();
</script>
</body>
</html>
